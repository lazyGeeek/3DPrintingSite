name: lint
on: push

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js - Cache dependencies - Install dependencies
        uses: ./.github/workflows/setup-node

      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit
